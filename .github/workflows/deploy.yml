name: Deploy Backend to Azure

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.x'

      - name: Build & Publish
        run: dotnet publish ./GameFactory.Api/GameFactory.Api.csproj -c Release -o ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'GameFactoryApiYM'
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: ./publish

      - name: Move Shortcut ticket to Done
        continue-on-error: true
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          STORY_ID=$(echo "$COMMIT_MSG" | grep -oP '(?<=sc-)\d+')
          if [ -n "$STORY_ID" ]; then
            curl -s -X PUT \
              -H "Content-Type: application/json" \
              -H "Shortcut-Token: ${{ secrets.SHORTCUT_API_TOKEN }}" \
              -d '{"workflow_state_id": 500000010}' \
              "https://api.app.shortcut.com/api/v3/stories/$STORY_ID"
            echo "Ticket sc-$STORY_ID movido a Done"
          else
            echo "No se encontró ticket de Shortcut en el mensaje del commit"
          fi